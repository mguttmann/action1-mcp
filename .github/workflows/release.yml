name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  mcpb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:mcpb
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.mcpb
          fail_on_unmatched_files: true
